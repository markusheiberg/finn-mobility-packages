name: Export data

on:
  schedule:
    # Mondays 06:00 UTC — after the Sunday 23:50 Oslo scrape in both DST states.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # commit the snapshot
  id-token: write   # WIF

concurrency:
  group: export-data

env:
  PROJECT_ID: vend-scrapers-v2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/895238155180/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vend-scrapers-v2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Export weekly package mix
        run: bash scripts/export_weekly_mix.sh data/weekly_package_mix.csv

      - name: Generate health report
        run: bash scripts/export_health.sh data/health.md

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "data: weekly export $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** i))
            git pull --rebase
          done
          echo "Push failed after retries" >&2
          exit 1
