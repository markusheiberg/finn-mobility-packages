name: Export BigQuery data to repo

# Snapshots the BigQuery output into data/ and commits it, so the numbers are
# readable straight from the repo — by Claude Code, in PR diffs, or on GitHub —
# without needing gcloud/bq access.
#
# Runs after the weekly scrape. The scrape fires Sundays 23:50 Oslo (21:50 UTC
# in summer, 22:50 UTC in winter) and takes a while, so Monday 06:00 UTC is
# comfortably after it in both DST states.
#
# The table is tiny (one row per site per weekly run), so the full history is
# committed — no per-listing data ever lands in git; the runs/ debug CSVs stay
# on GCP only.
#
# Needs BigQuery read access on the deploy service account — github-deployer
# already holds bigquery.jobUser + bigquery.dataViewer from vend-scraper-v2.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:   # run on demand from the Actions tab

concurrency:
  group: export-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # needed to commit the snapshot back
      id-token: write    # needed for Workload Identity Federation

    env:
      PROJECT: vend-scrapers-v2

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/895238155180/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vend-scrapers-v2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check the sample fraction is recorded
        # Package counts scale with SAMPLE_FRACTION. If a scraper's value no
        # longer matches the last entry in scripts/sample_fraction.sh, the
        # exported sample_fraction column would be wrong, so stop here.
        run: |
          source scripts/sample_fraction.sh
          check_sample_fraction .

      - name: Export full run history
        # Sorted by run_timestamp ASC so each week appends to the end of the
        # file and the git diff stays small instead of rewriting everything.
        #
        # grep drops the "WARNING: --scopes ... external_account" line bq emits
        # on STDOUT under Workload Identity auth; unfiltered it becomes line 1
        # of the CSV and Excel reads it as the header. Invisible in Cloud Shell
        # (normal account, no warning), so only CI files would be malformed.
        #
        # sample_fraction is derived from scripts/sample_fraction.sh: counts are
        # a sample, and doubled on 2026-07-20 when the sample went 5% -> 10%.
        run: |
          mkdir -p data
          source scripts/sample_fraction.sh
          bq query --use_legacy_sql=false --project_id="${PROJECT}" \
            --format=csv --max_rows=100000 \
          "SELECT FORMAT_TIMESTAMP('%Y-%m-%d %H:%M:%S', run_timestamp) AS run_timestamp,
                  site, premium_count, pluss_count, basis_count, total_count,
                  $(sample_fraction_sql run_timestamp) AS sample_fraction
             FROM \`${PROJECT}.market_scraper.mobility_packages\`
            ORDER BY run_timestamp ASC, site" \
          | grep -v '^WARNING:' > data/mobility_packages.csv

      - name: Export weekly package mix
        # Pre-aggregated weekly mix (counts + share % per package, per site) —
        # derivable from mobility_packages.csv, but committed ready-made so it
        # can be downloaded from GitHub straight into Excel without pivoting.
        run: bash scripts/export_weekly_mix.sh data/weekly_package_mix.csv

      - name: Build health report
        # Layer-2 (pull) health check. The [WARN] log lines are layer 1, but
        # they cannot fire if the job never runs — no run means no log line,
        # and silence looks exactly like success. This table is what catches a
        # dead scheduler.
        #
        # finn and blocket write rows at different timestamps (two scripts, one
        # job), so freshness and volume are checked PER SITE — one site's script
        # crashing while the other succeeds shows up as that site going stale.
        run: |
          bq_q() {
            bq query --use_legacy_sql=false --project_id="${PROJECT}" "$@" 2>&1 \
              | grep -v '^WARNING:' || true
          }

          {
            echo "# Scraper health"
            echo
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC') by .github/workflows/export_data.yml"
            echo
            echo "Weekly scrape: Sundays 23:50 Oslo, one row per site per run."
            echo
            echo "status per site:"
            echo "- **OK** — fresh row, sane volume"
            echo "- **STALE** — latest row older than 8 days: the job may not be running"
            echo "  at all for this site. No run also means no [WARN] in the logs, so"
            echo "  this table is the only thing that catches it."
            echo "- **ZERO** — a row was written but nothing was classified (scrape ran,"
            echo "  parser found no listings — likely a site markup change)"
            echo "- **VOLUME DROP** — total more than 50% below the previous run (a"
            echo "  breaking parser usually halves the count rather than zeroing it)"
            echo
            echo "## Latest run per site"
            echo
            echo '```'
          } > data/health.md

          bq_q --format=pretty \
          "WITH ranked AS (
             SELECT site, run_timestamp, total_count, premium_count, pluss_count, basis_count,
                    ROW_NUMBER() OVER (PARTITION BY site ORDER BY run_timestamp DESC) AS rn
               FROM \`${PROJECT}.market_scraper.mobility_packages\`
           )
           SELECT l.site,
                  FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', l.run_timestamp) AS latest_run,
                  TIMESTAMP_DIFF(CURRENT_TIMESTAMP(), l.run_timestamp, DAY) AS age_days,
                  l.total_count, p.total_count AS prev_total,
                  l.premium_count, l.pluss_count, l.basis_count,
                  CASE
                    WHEN TIMESTAMP_DIFF(CURRENT_TIMESTAMP(), l.run_timestamp, DAY) > 8 THEN 'STALE'
                    WHEN l.total_count = 0 THEN 'ZERO'
                    WHEN p.total_count IS NOT NULL AND l.total_count < p.total_count * 0.5 THEN 'VOLUME DROP'
                    ELSE 'OK'
                  END AS status
             FROM ranked AS l
             LEFT JOIN ranked AS p ON p.site = l.site AND p.rn = 2
            WHERE l.rn = 1
            ORDER BY l.site" >> data/health.md

          {
            echo '```'
            echo
            echo "## Runs whose package mix looks wrong (full history)"
            echo
            echo "Empty table = every run looks sane. A volume check cannot see these:"
            echo "the total stays plausible while the classification breaks."
            echo
            echo "- **MIX SHIFT** — a package's share moved >15pp against the mean of the"
            echo "  previous 4 runs. Runs with Premium or Basis at zero are left out of that"
            echo "  baseline, so one broken run cannot flag the healthy run after it"
            echo "- **<PACKAGE> ZERO** — a package that appeared in any of the previous 4"
            echo "  runs is now zero (blocket 2026-05-17 and 05-24: Premium read as zero,"
            echo "  every dealer as Basis)"
            echo
            echo "Shares, not counts, so the 2026-07-20 sample change (5% -> 10%) does not flag."
            echo
            echo '```'
          } >> data/health.md

          bq_q --format=pretty --max_rows=1000 \
          "WITH runs AS (
             SELECT site, run_timestamp, premium_count, pluss_count, basis_count, total_count,
                    SAFE_DIVIDE(premium_count, total_count) * 100 AS prem,
                    SAFE_DIVIDE(pluss_count,   total_count) * 100 AS plus,
                    SAFE_DIVIDE(basis_count,   total_count) * 100 AS bas,
                    premium_count > 0 AND basis_count > 0         AS baseline_ok
               FROM \`${PROJECT}.market_scraper.mobility_packages\`
           ),
           w AS (
             SELECT *,
                    AVG(IF(baseline_ok, prem, NULL)) OVER prev4 AS prem4,
                    AVG(IF(baseline_ok, plus, NULL)) OVER prev4 AS plus4,
                    AVG(IF(baseline_ok, bas,  NULL)) OVER prev4 AS bas4,
                    COUNTIF(baseline_ok)             OVER prev4 AS n4,
                    MAX(premium_count) OVER prev4 AS prem_max4,
                    MAX(pluss_count)   OVER prev4 AS plus_max4,
                    MAX(basis_count)   OVER prev4 AS bas_max4
               FROM runs
             WINDOW prev4 AS (PARTITION BY site ORDER BY run_timestamp
                              ROWS BETWEEN 4 PRECEDING AND 1 PRECEDING)
           ),
           flagged AS (
             SELECT *,
                    CONCAT(
                      IF(n4 >= 2 AND GREATEST(ABS(prem - prem4), ABS(plus - plus4), ABS(bas - bas4)) > 15,
                         'MIX SHIFT; ', ''),
                      IF(premium_count = 0 AND prem_max4 > 0, 'PREMIUM ZERO; ', ''),
                      IF(pluss_count   = 0 AND plus_max4 > 0, 'PLUSS ZERO; ',   ''),
                      IF(basis_count   = 0 AND bas_max4  > 0, 'BASIS ZERO; ',   '')
                    ) AS problems
               FROM w
           )
           SELECT site, FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', run_timestamp) AS run,
                  premium_count, pluss_count, basis_count, total_count,
                  ROUND(prem, 1) AS premium_pct, ROUND(prem4, 1) AS premium_pct_prev4,
                  problems
             FROM flagged
            WHERE problems != ''
            ORDER BY run_timestamp, site" >> data/health.md

          echo '```' >> data/health.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tradera vs Blocket private cars (weekly)
        # The census itself runs in Cloud Run, inside the Sunday mobility-packages
        # job (run_all.py), and appends one run of summary rows to
        # market_scraper.private_cars_se. Here: copy that table to
        # data/private_cars_se/history.csv and render summary.md + CSVs from the
        # latest run. Aggregates only; per-listing rows never leave Cloud Run.
        #
        # Skips cleanly until the first census has written the table, and
        # continue-on-error so it can never cost the package snapshot.
        continue-on-error: true
        run: |
          if ! bq show --project_id="${PROJECT}" "${PROJECT}:market_scraper.private_cars_se" >/dev/null 2>&1; then
            echo "market_scraper.private_cars_se does not exist yet; skipping."
            exit 0
          fi
          mkdir -p data/private_cars_se
          bq query --use_legacy_sql=false --project_id="${PROJECT}" \
            --format=csv --max_rows=1000000 \
          "SELECT FORMAT_TIMESTAMP('%Y-%m-%dT%H:%M:%S+00:00', run_timestamp) AS run_timestamp,
                  site, metric, band, value
             FROM \`${PROJECT}.market_scraper.private_cars_se\`
            ORDER BY run_timestamp, site, metric, band" \
          | grep -v '^WARNING:' > data/private_cars_se/history.csv
          pip install --quiet requests beautifulsoup4    # module imports; --render fetches nothing
          python3 private_cars_se_compare.py \
            --render data/private_cars_se/history.csv --out data/private_cars_se

      # Commit only from main. This step pushes HEAD to main, so dispatched from
      # a feature branch it would land that branch's unreviewed commits there.
      # A branch run prints the result instead, which is how to test a query change.
      - name: Show result (branch run, not committed)
        if: github.ref != 'refs/heads/main'
        run: |
          git status --short data/
          cat data/health.md
          cat data/private_cars_se/summary.md || true
          head -5 data/weekly_package_mix.csv data/mobility_packages.csv

      - name: Commit snapshot if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change in exported data — nothing to commit."
            exit 0
          fi
          # [skip ci] belt-and-braces; deploy.yml also path-ignores data/ so a
          # snapshot commit never triggers a docker build.
          git commit -m "chore(data): refresh BigQuery snapshot [skip ci]"
          # Rebase in case something else landed on main while the query ran.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((2 ** i))
          done
          exit 1
