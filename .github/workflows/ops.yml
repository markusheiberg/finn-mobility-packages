name: Ops

# GCP on demand, from a fixed menu. Everything a step prints is readable by
# Claude Code via the workflow job log — that is the return path from GCP.
#
# Keep it a fixed menu: a free-form "run any gcloud command" input would make
# repo write access equivalent to full control of the GCP project. When
# something new is needed, add a *named action*.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        required: true
        options:
          - logs
          - check-deploy
          - bq-tail
          - run-scraper
      lines:
        description: 'Log lines to fetch (logs action)'
        required: false
        default: '300'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: vend-scrapers-v2
  REGION: europe-north1
  JOB_NAME: mobility-packages

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/895238155180/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vend-scrapers-v2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Recent job output, oldest first (gcloud returns newest first).
      - name: logs
        if: inputs.action == 'logs'
        run: |
          gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="'"$JOB_NAME"'"' \
            --project="$PROJECT_ID" \
            --limit="${{ inputs.lines }}" \
            --format='value(timestamp,textPayload)' \
            --freshness=30d | tac

      # Deployed image + execution history: answers "will the next run use my
      # change, and is the schedule even firing?" in one shot.
      - name: check-deploy
        if: inputs.action == 'check-deploy'
        run: |
          echo "== Deployed image =="
          gcloud run jobs describe "$JOB_NAME" --region="$REGION" \
            --format='value(template.template.containers[0].image)'
          echo
          echo "== Recent executions =="
          gcloud run jobs executions list --job="$JOB_NAME" --region="$REGION" --limit=10

      # Last 12 BigQuery summary rows.
      - name: bq-tail
        if: inputs.action == 'bq-tail'
        run: |
          touch ~/.bigqueryrc
          bq query --project_id="$PROJECT_ID" --use_legacy_sql=false --format=pretty --max_rows=12 \
            'SELECT * FROM `vend-scrapers-v2.market_scraper.mobility_packages`
             ORDER BY run_timestamp DESC LIMIT 12'

      # Kick off an ad-hoc scrape. Async — the full run takes hours, longer
      # than a runner should wait. Follow up with the "logs" action.
      - name: run-scraper
        if: inputs.action == 'run-scraper'
        run: |
          gcloud run jobs execute "$JOB_NAME" --region="$REGION"
          echo
          echo "Execution started (async). Use the 'logs' action later to see output."
